name: Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: warema-bridge/rootfs/srv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: warema-bridge/rootfs/srv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Install isolated MQTT test broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          # Ubuntu's Mosquitto AppArmor profile permits configs below conf.d,
          # but rejects the default /tmp location used by os.tmpdir().
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /etc/mosquitto/conf.d/warema-tests

      - name: MQTT integration tests
        env:
          TMPDIR: /etc/mosquitto/conf.d/warema-tests
        run: npm run test:integration

      - name: Smoke test
        run: npm run smoke
